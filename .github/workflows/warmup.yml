# Giữ backend free (Render) ấm: Render ngủ sau 1 lúc vắng khách, lần mở đầu chờ ~50s.
# QUAN TRỌNG: chỉ ping "/" (không chạm DB). TUYỆT ĐỐI không ping "/health":
#   /health chạy "SELECT 1" -> đánh thức compute Neon -> Neon không bao giờ auto-suspend
#   -> đốt hết 100 CU-hours/tháng của gói Free (730h x 0.25 CU = 182.5 CU-h nếu thức 24/7)
#   -> Neon chặn kết nối: "Your account or project has exceeded the quota".
# Ping "/" giữ Render ấm, còn Neon được ngủ sau 5 phút rỗng; Neon chỉ thức khi có request thật
# (cold start ~1s, chấp nhận được).
name: warmup

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API (không chạm DB)
        run: curl -m 90 -f https://english-api-c6w0.onrender.com/
